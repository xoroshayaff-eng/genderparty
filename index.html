<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гендер пати</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8EEE9;--out:#EEDFD8;--ink:#7a6a63;--soft:#9a8a82;--pk:#F4B8C8;--pkd:#c9708c;--bl:#B9D6F2;--bld:#5f94cc}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html.lock,html.lock body{overflow:hidden;height:100%}
body{background:var(--out);color:var(--ink);font-family:'Jost','Segoe UI',Arial,sans-serif;font-weight:300;line-height:1.7}
.wrap{max-width:460px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden;min-height:100vh}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
svg{display:block}

#cur{position:fixed;inset:0;z-index:100}
#cur .p{position:absolute;top:0;bottom:0;width:50%;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.32) 0 7px,transparent 7px 26px)}
#cur .l{left:0;background-color:var(--pk);transform-origin:left}
#cur .r{right:0;background-color:var(--bl);transform-origin:right}
#cur .rod{position:absolute;top:0;left:0;right:0;height:12px;background:#d8c3a5;z-index:2}
#op{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);border:0;background:#fff;color:var(--ink);font:400 17px 'Cormorant Garamond',Georgia,serif;font-style:italic;padding:16px 30px;border-radius:40px;cursor:pointer;animation:pulse 2.4s ease-in-out infinite;box-shadow:0 6px 24px rgba(150,100,110,.25)}
#op:focus-visible,.btn:focus-visible,.lg button:focus-visible{outline:2px solid var(--bld);outline-offset:3px}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.06)}}
#cur.go .p{animation:draw 2s cubic-bezier(.7,0,.3,1) forwards}
#cur.go #op{animation:none;opacity:0;transition:opacity .4s}
@keyframes draw{to{transform:scaleX(.08)}}

.lg{position:fixed;top:12px;right:max(12px,calc(50% - 218px));z-index:50;display:flex;background:rgba(255,255,255,.85);border-radius:20px;padding:3px;opacity:0;pointer-events:none;transition:opacity .8s 1.6s}
body.go .lg{opacity:1;pointer-events:auto}
.lg button{border:0;background:none;font:400 13px 'Jost',sans-serif;color:var(--soft);padding:5px 12px;border-radius:16px;cursor:pointer}
.lg button.on{background:var(--pk);color:#fff}

.hero{position:relative;height:min(100vh,740px);min-height:600px;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:max(104px,16vh)}
.hero>*{position:relative;z-index:2}
.cld{position:absolute;z-index:1;color:var(--bl);opacity:.85;animation:drift 14s ease-in-out infinite alternate}
.cld.pk{color:var(--pk)}
@keyframes drift{to{transform:translateX(22px)}}
.sm{font-size:clamp(48px,14vw,62px);font-style:italic;color:var(--soft);line-height:1}
.ttl{font-size:clamp(30px,9.6vw,40px);font-weight:500;letter-spacing:4px;line-height:1.2;margin-top:4px}
.shim span{display:inline-block;animation:shim 7s ease-in-out infinite;color:#8a7a72}
@keyframes shim{0%,100%{color:#8a7a72}30%{color:#d98aa3}65%{color:#6fa0d4}}
.sub{font-size:19px;color:#b9858f;margin-top:14px;letter-spacing:1px}
.hero .in{opacity:0;transform:translateY(18px)}
body.go .hero .in{animation:up 1.1s forwards}
@keyframes up{to{opacity:1;transform:none}}
.bln{position:absolute;z-index:1;animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px) rotate(3deg)}}
.bears{--bs:min(30vw,135px);position:absolute;bottom:0;left:0;right:0;z-index:2;height:340px}
.base{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);width:min(128%,580px);max-width:none}
.bunch{position:absolute;bottom:100px;width:min(36vw,160px);animation:bob 5s ease-in-out infinite}
.bunch.l{left:6%}.bunch.r{right:6%;animation-delay:-2.5s}
.wc{position:absolute;z-index:1;animation:drift 16s ease-in-out infinite alternate}
.ht{position:absolute;z-index:1;animation:bob 5s ease-in-out infinite;opacity:.9}
.bear{position:absolute;bottom:34px;width:var(--bs);animation:bob 4s ease-in-out infinite}

.blk{position:relative;z-index:1;padding:46px 30px;text-align:center;opacity:0;transform:translateY(26px);transition:opacity 1s,transform 1s}
.blk.in{opacity:1;transform:none}
h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:28px;line-height:1.25;margin-bottom:16px}
p{font-size:16px;margin-bottom:14px}
.card{background:#fff;border-radius:20px;padding:34px 24px;margin:0 16px;box-shadow:0 8px 30px rgba(190,140,150,.12)}
.heart{width:150px;margin:0 auto;animation:beat 2.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.09)}30%{transform:scale(1)}45%{transform:scale(1.06)}}
.row{display:flex;align-items:center;gap:14px;text-align:left;max-width:300px;margin:0 auto 18px}
.row svg{flex:none;width:34px;height:34px;color:var(--pkd)}
.row.t svg{color:var(--bld)}
.btn{display:inline-block;text-decoration:none;font:400 15px 'Jost',sans-serif;color:#6b5a55;background:linear-gradient(90deg,var(--bl),var(--pk));padding:14px 30px;border-radius:30px;margin-top:8px;transition:transform .3s}
.btn:hover{transform:translateY(-2px)}
.dots{display:flex;justify-content:center;gap:22px;margin:22px 0}
.dot{width:90px;height:90px;border-radius:50%;animation:fl 5s ease-in-out infinite}
.dot.b{background:radial-gradient(circle at 35% 30%,#e2effc,#9fc4ec)}
.dot.p{background:radial-gradient(circle at 35% 30%,#fde4ea,#efa3b9);animation-delay:-2.5s}
@keyframes fl{50%{transform:translateY(-10px)}}
.names{font-size:24px;font-style:italic;color:var(--soft);padding:10px 30px 60px;text-align:center}
.fh{position:fixed;z-index:40;bottom:-20px;pointer-events:none;animation:rise 8s linear forwards;font-size:18px}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.ph{position:relative;margin:0 20px}
.ph .in2{position:relative;overflow:hidden;border-radius:22px;aspect-ratio:4/3.3;background:#f6dfe5;box-shadow:0 8px 30px rgba(190,140,150,.18);border:6px solid #fff}
.ph.s .in2{aspect-ratio:3/4;max-width:300px;margin:0 auto;transform:rotate(-1.5deg)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:zm 14s ease-in-out infinite alternate}
@keyframes zm{to{transform:scale(1.06)}}
.ph .ph-t{display:none}
.ph.bad img{display:none}
.bow{position:absolute;left:50%;bottom:-34px;width:190px;margin-left:-95px;z-index:3;transform-origin:50% 50%;animation:sway 5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(2.5deg)}}
.ft{display:flex;justify-content:center;gap:16px;margin-bottom:10px}
.ft svg{width:34px;height:52px}
.f1{color:var(--pk);transform:rotate(-14deg);animation:step 3s infinite}
.f2{color:var(--bl);transform:rotate(14deg);animation:step 3s 1.5s infinite;margin-top:14px}
@keyframes step{0%,100%{opacity:.35}50%{opacity:1}}
.pg{list-style:none;display:grid;gap:16px;max-width:340px;margin:8px auto 0;text-align:left}
.pg li{display:flex;gap:14px;align-items:flex-start}
.pg strong{font-weight:500;font-size:16px;display:block}
.pg p{font-size:14px;margin:0;line-height:1.5}
.ic{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ic svg{width:22px;height:22px}
.ic.p{background:#fbe0e7;color:#c9708c}
.ic.b{background:#dfeefb;color:#4a86c4}
.vase{width:100%;margin:0;overflow:visible}
.bq{transform-origin:110px 215px;animation:sw 6s ease-in-out infinite}
@keyframes sw{50%{transform:rotate(1.6deg)}}
.st.a{stroke-dasharray:220;stroke-dashoffset:220;animation:dr .9s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.hd{transform-box:fill-box;transform-origin:center}
.hd.a{transform:scale(0);animation:pp .7s .7s forwards cubic-bezier(.3,1.6,.5,1)}
@keyframes pp{to{transform:scale(1)}}
.vb{display:flex;flex-direction:column;gap:10px;max-width:260px;margin:0 auto}
.vb button{border:0;border-radius:30px;padding:14px 20px;font:400 15px 'Jost',sans-serif;cursor:pointer;transition:transform .2s}
.vb button:active{transform:scale(.97)}
.vb button:focus-visible,.vr:focus-visible{outline:2px solid var(--bld);outline-offset:3px}
.vp{background:#F4B8C8;color:#6b3a4a}
.vbl{background:#B9D6F2;color:#2f4f73}
.vc{font-size:14px;margin:14px 0 4px}
.vr{border:0;background:none;color:var(--soft);font:300 13px 'Jost',sans-serif;text-decoration:underline;cursor:pointer}
.lf.a{opacity:0;animation:lfa .6s .6s forwards}
@keyframes lfa{to{opacity:1}}
.nm{display:block;width:100%;max-width:260px;margin:4px auto 10px;border:1px solid #e6d3cd;border-radius:26px;padding:12px 18px;background:#fff;color:var(--ink);font:400 16px 'Jost',sans-serif;text-align:center}
.nm::placeholder{color:#b9aaa3}
.nm:focus{outline:2px solid var(--bl);outline-offset:2px}
.nm.bad{border-color:#d96a8c;animation:shk .4s}
.nm:disabled{background:#f3ebe7}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.vase{transition:filter .25s}
.vase.hot{filter:drop-shadow(0 0 14px rgba(244,150,175,.9))}
.tray{display:flex;justify-content:center;gap:34px;margin-top:6px}
.rs{width:92px;text-align:center;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;transition:opacity .3s}
.rs .ri svg{width:78px;height:auto;margin:0 auto;display:block;animation:bob 4s ease-in-out infinite}
.rs span{display:block;font-size:14px;margin-top:2px}
.rs.lift{opacity:.3}
.rs:focus-visible{outline:2px solid var(--bld);outline-offset:4px;border-radius:12px}
.tray.lock .rs{opacity:.3;pointer-events:none;filter:grayscale(.5)}
.rs.ghost{position:fixed;z-index:200;pointer-events:none;opacity:.95;transform:scale(1.2) rotate(-6deg);cursor:grabbing}
@media (prefers-reduced-motion:reduce){.st.a{stroke-dashoffset:0}.hd.a{transform:none}.lf.a{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.blk,.hero .in{opacity:1;transform:none}}

.card{position:relative}
button.btn{border:0;cursor:pointer}.btn:disabled{opacity:.6}
.vw{position:relative;width:min(100%,290px);margin:6px auto 4px}
.pb{position:absolute;z-index:0;pointer-events:none;opacity:.7;animation:bob 6s ease-in-out infinite}
.nm.wsh{border-radius:18px;resize:none;line-height:1.4}
.bub{max-width:300px;min-height:62px;margin:6px auto 4px;padding:10px 16px;background:#fff;border-radius:16px;font-size:14px;line-height:1.4;box-shadow:0 4px 18px rgba(190,140,150,.12);display:flex;flex-direction:column;justify-content:center;word-break:break-word}
.bub b{font:italic 500 19px 'Cormorant Garamond',Georgia,serif}
.vct{font-size:13px;color:var(--soft);margin-bottom:10px}
.hd.new{transform:scale(0);animation:pp .8s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:var(--dl,0s)}
.sx.new{stroke-dasharray:240;stroke-dashoffset:240;animation:dr2 .8s forwards;animation-delay:var(--dl,0s)}
@keyframes dr2{to{stroke-dashoffset:0}}
.pf{position:absolute;border-radius:50%;filter:blur(16px);pointer-events:none;opacity:0;z-index:5}
.pfh{position:absolute;pointer-events:none;font-size:16px;opacity:0;z-index:5}
.cd{display:flex;justify-content:center;gap:8px}
.cd div{width:70px;padding:12px 0 8px;border-radius:16px;background:#fff;box-shadow:0 6px 20px rgba(190,140,150,.12)}
.cd b{display:block;font:500 30px/1.1 'Cormorant Garamond',Georgia,serif;color:var(--pkd)}
.cd div:nth-child(even) b{color:var(--bld)}
.cd span{font-size:12px;color:var(--soft)}
.stp{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 4px}
.stp button{width:44px;height:44px;border-radius:50%;border:1px solid #e6d3cd;background:#fff;color:var(--ink);font:300 24px 'Jost',sans-serif;cursor:pointer}
.stp output{font:500 42px/1 'Cormorant Garamond',Georgia,serif;min-width:48px;color:var(--pkd)}
.stp button:focus-visible,#go:focus-visible{outline:2px solid var(--bld);outline-offset:3px}
.gl{font-size:13px;color:var(--soft);margin-bottom:8px}
.er{color:#d96a8c;font-size:13px;min-height:20px}
#ex .nm{margin-bottom:8px}
.ok svg{width:70px;height:70px;margin:0 auto}.ok path{stroke-dasharray:60;animation:dr3 .7s .2s both}
@keyframes dr3{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.hd.new{transform:none}.sx.new{stroke-dashoffset:0}.pb{animation:none}.ok path{stroke-dashoffset:0}}
</style>
</head>
